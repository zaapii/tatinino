[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/mapa/"
  status = 301
  force = true

# Las notas publicadas después del último build siguen abiertas hasta el próximo despliegue.
# Las páginas ya prerenderizadas tienen prioridad sobre esta regla.
[[redirects]]
  from = "/novedades/*"
  to = "/200.html"
  status = 200
